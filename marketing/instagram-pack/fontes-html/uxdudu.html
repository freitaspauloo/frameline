<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<title>Frameline · ux.dudu</title>
<style>
  @font-face { font-family: Inter; src: url("fonts/Inter-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }
  @font-face { font-family: Inter; src: url("fonts/Inter-Medium.ttf") format("truetype"); font-weight: 500; font-display: block; }
  @font-face { font-family: Inter; src: url("fonts/Inter-Semibold.ttf") format("truetype"); font-weight: 600; font-display: block; }
  @font-face { font-family: Inter; src: url("fonts/Inter-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
  @font-face { font-family: Inter; src: url("fonts/Inter-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: block; }
  @font-face { font-family: "Instrument Serif"; src: url("fonts/InstrumentSerif-Regular.ttf") format("truetype"); font-weight: 400; font-display: block; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #070b14; }
  .post {
    position: relative;
    width: 1080px;
    height: 1350px;
    padding: 56px 64px 52px;
    display: flex;
    flex-direction: column;
    color: #f4f7ff;
    font-family: Inter, sans-serif;
    background:
      radial-gradient(90% 55% at 100% 0%, rgba(45, 107, 255, 0.55), transparent 58%),
      radial-gradient(70% 45% at 0% 100%, rgba(27, 77, 209, 0.35), transparent 62%),
      #070b14;
  }
  .grain {
    position: absolute;
    inset: 0;
    background-image: url("grain.png?v=3");
    background-size: 720px 720px;
    opacity: 0.4;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  .stage { position: relative; z-index: 2; height: 860px; }
  .card {
    height: 860px;
    border-radius: 36px;
    overflow: hidden;
    background: #fff;
    color: #0b0d12;
    -webkit-mask-image: linear-gradient(to bottom, #000 84%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 84%, transparent 100%);
  }
  .nav {
    height: 78px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 22px;
    border-bottom: 1px solid #e6e8ec;
    background: #fff;
  }
  .links { display: flex; gap: 16px; }
  .links span, .signin {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6b7280;
  }
  .signin { justify-self: end; }
  .mark { width: 34px; height: 34px; display: block; }
  .hero {
    text-align: center;
    padding: 42px 48px 28px;
  }
  .hero h2 {
    font-family: "Instrument Serif", serif;
    font-weight: 400;
    font-size: 64px;
    line-height: 0.96;
    letter-spacing: -0.03em;
  }
  .hero p {
    margin: 16px auto 0;
    max-width: 22em;
    font-size: 18px;
    line-height: 1.4;
    color: #5c6574;
  }
  .btn {
    display: inline-block;
    margin-top: 22px;
    background: #0b0d12;
    color: #fff;
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: 500;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 18px 18px;
  }
  .tile {
    position: relative;
    aspect-ratio: 16/9;
    border-radius: 14px;
    overflow: hidden;
    background: #eaf1ff;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 54px;
    background: linear-gradient(to top, rgba(0,0,0,.55), transparent);
  }
  .tile b {
    position: absolute;
    z-index: 1;
    left: 12px;
    bottom: 10px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .pill {
    position: absolute;
    z-index: 4;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    background: #2d6bff;
    color: #fff;
    border-radius: 999px;
    padding: 14px 26px;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.03em;
  }
  .copy { position: relative; z-index: 2; margin-top: 48px; }
  .copy h1 {
    font-size: 92px;
    font-weight: 800;
    letter-spacing: -0.055em;
    line-height: 0.92;
  }
  .copy p {
    margin-top: 22px;
    max-width: 16em;
    font-size: 32px;
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: -0.02em;
    color: rgba(244, 247, 255, 0.66);
  }
  .foot {
    position: relative;
    z-index: 2;
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    color: rgba(244, 247, 255, 0.82);
    font-size: 26px;
    font-weight: 500;
  }
  .foot .mark { width: 28px; height: 28px; }
</style>
</head>
